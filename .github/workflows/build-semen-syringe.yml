name: Build Semen Syringe

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: NON-Syringe
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.5.0'

      - name: Build
        run: gradle clean build --no-daemon

      - name: Verify mod resources
        run: |
          jar_file=$(find build/libs -maxdepth 1 -name 'semen-syringe-*.jar' ! -name '*sources.jar' | head -n 1)
          if [ -z "$jar_file" ]; then
            echo "No main Semen Syringe jar found in build/libs"
            ls -la build/libs
            exit 1
          fi
          echo "Verifying $jar_file"
          jar tf "$jar_file" > /tmp/semen-syringe-jar-contents.txt
          cat /tmp/semen-syringe-jar-contents.txt
          grep -Fx 'fabric.mod.json' /tmp/semen-syringe-jar-contents.txt
          grep -Fx 'data/semen_syringe/recipe/fill_syringe.json' /tmp/semen-syringe-jar-contents.txt
          grep -Fx 'assets/semen_syringe/lang/en_us.json' /tmp/semen-syringe-jar-contents.txt

      - uses: actions/upload-artifact@v4
        with:
          name: semen-syringe
          path: NON-Syringe/build/libs/semen-syringe-*.jar
