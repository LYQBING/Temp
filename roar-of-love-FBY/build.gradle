import groovy.json.JsonSlurper

plugins {
	id 'fabric-loom' version '1.17.21'
}

def sourceIntermediaryVersion = '1.21.11'
def generatedSourceDirectory = layout.buildDirectory.dir('generated/sources/official/main')
def sourceClientMappingsFile = layout.buildDirectory.file("mappings/${sourceIntermediaryVersion}-client.txt")

version = project.mod_version
group = project.maven_group

base {
	archivesName = 'roar-of-love'
}

repositories {
	maven { url = 'https://maven.fabricmc.net/' }
	mavenCentral()
}

configurations {
	legacyIntermediary
}

dependencies {
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	legacyIntermediary "net.fabricmc:intermediary:${legacyIntermediaryVersion}:v2"
	modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
	modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"
	compileOnly files('../needsofnature')
}

sourceSets {
	main {
		java.setSrcDirs([generatedSourceDirectory])
		resources.srcDirs = ['.']
		resources.exclude 'com/**', 'META-INF/**', 'build/**', '.gradle/**', '.github/**', '**/*.java', '**/*.class', 'build.gradle', 'settings.gradle', 'gradle.properties'
	}
}

tasks.register('downloadLegacyOfficialMappings') {
	outputs.file(legacyClientMappingsFile)
	doLast {
		def versionManifest = new JsonSlurper().parse(new URL('https://piston-meta.mojang.com/mc/game/version_manifest_v2.json'))
		def legacyVersion = versionManifest.versions.find { it.id == legacyIntermediaryVersion }
		if (legacyVersion == null) {
			throw new GradleException("Minecraft ${legacyIntermediaryVersion} mappings were not found")
		}
		def versionMetadata = new JsonSlurper().parse(new URL(legacyVersion.url))
		def mappingsUrl = versionMetadata.downloads.client_mappings.url
		def mappingsFile = legacyClientMappingsFile.get().asFile
		mappingsFile.parentFile.mkdirs()
		mappingsFile.withOutputStream { output ->
			new URL(mappingsUrl).withInputStream { input -> output << input }
		}
	}
}

tasks.register('remapIntermediarySources') {
	inputs.dir('com')
	inputs.files(configurations.legacyIntermediary)
	dependsOn tasks.named('downloadLegacyOfficialMappings')
	outputs.dir(generatedSourceDirectory)
	doLast {
		def intermediaryZip = new java.util.zip.ZipFile(configurations.legacyIntermediary.singleFile)
		def mappingsEntry = intermediaryZip.getEntry('mappings/mappings.tiny')
		if (mappingsEntry == null) {
			throw new GradleException('The Intermediary mappings archive has no mappings/mappings.tiny')
		}
		def tinyMappings
		intermediaryZip.getInputStream(mappingsEntry).withCloseable { tinyMappings = it.getText('UTF-8') }
		intermediaryZip.close()

		def classNames = [:]
		def simpleClassNames = [:]
		def classOwnerCandidates = [:].withDefault { new LinkedHashSet<String>() }
		def intermediaryClassOwners = [:]
		def intermediaryClassSimpleNames = [:]
		def intermediaryMembers = []
		def sourceRoot = file('com')
		def sourceFiles = fileTree(sourceRoot).matching { include '**/*.java' }.files
		def usedClassNames = [] as Set
		def usedMemberNames = [] as Set
		sourceFiles.each { sourceFile ->
			def sourceText = sourceFile.getText('UTF-8')
			(sourceText =~ /\bclass_\d+\b/).each { usedClassNames << it.toString() }
			(sourceText =~ /\b(?:method|field)_\d+\b/).each { usedMemberNames << it.toString() }
		}
		def currentOwner = null
		tinyMappings.eachLine { line ->
			def fields = line.split('\\t', -1)
			if (fields[0] == 'c') {
				currentOwner = fields[1]
				def intermediaryName = fields[2]
				intermediaryClassOwners[intermediaryName] = currentOwner
				def simpleIntermediaryName = intermediaryName.substring(intermediaryName.lastIndexOf('/') + 1)
				intermediaryClassSimpleNames[simpleIntermediaryName] = intermediaryName
				if (usedClassNames.contains(simpleIntermediaryName)) {
					classOwnerCandidates[simpleIntermediaryName] << currentOwner
				}
				if (simpleIntermediaryName.contains('$')) {
					def nestedName = simpleIntermediaryName.substring(simpleIntermediaryName.lastIndexOf('$') + 1)
					if (usedClassNames.contains(nestedName)) {
						classOwnerCandidates[nestedName] << currentOwner
					}
				}
			} else if (fields.length > 4 && fields[0].isEmpty() && (fields[1] == 'm' || fields[1] == 'f') && usedMemberNames.contains(fields[4])) {
				intermediaryMembers << [owner: currentOwner, kind: fields[1], descriptor: fields[2], official: fields[3], intermediary: fields[4]]
			}
		}
		classOwnerCandidates.each { intermediaryName, owners ->
			if (owners.size() != 1) {
				throw new GradleException("Ambiguous intermediary class mapping for ${intermediaryName}: ${owners}")
			}
			classNames[intermediaryName] = owners.first()
		}

		def officialNamesByClass = [:]
		def officialNamesByObfuscatedName = [:]
		def memberNamesBySignature = [:].withDefault { new LinkedHashSet<String>() }
		def memberNamesByOwnerAndName = [:].withDefault { new LinkedHashSet<String>() }
		def mappingsLines = legacyClientMappingsFile.get().asFile.readLines('UTF-8')
		mappingsLines.each { line ->
			def classMatch = line =~ /^(.+) -> ([^:]+):$/
			if (classMatch.matches()) {
				def obfuscatedName = classMatch.group(2).replace('.', '/')
				def officialName = classMatch.group(1)
				officialNamesByClass[obfuscatedName] = officialName
				officialNamesByObfuscatedName[obfuscatedName] = officialName.replace('.', '/')
			}
		}
		String mappingOwner = null
		mappingsLines.each { line ->
			def classMatch = line =~ /^(.+) -> ([^:]+):$/
			if (classMatch.matches()) {
				mappingOwner = classMatch.group(2)
			} else if (mappingOwner != null && line.startsWith('    ') && line.contains(' -> ')) {
				def pair = line.trim().split(' -> ', 2)
				def signature = pair[0].replaceFirst(/^(?:\d+:\d+:)+/, '')
				if (signature.contains('(')) {
					def beforeParameters = signature.substring(0, signature.indexOf('(')).trim()
					def officialName = beforeParameters.tokenize(' ').last()
					def parameterText = signature.substring(signature.indexOf('(') + 1, signature.lastIndexOf(')'))
					def parameterTypes = parameterText.isEmpty() ? [] : parameterText.split(',').collect { it.trim() }
					def normalizedOwner = mappingOwner.replace('.', '/')
					memberNamesBySignature["${normalizedOwner}:${pair[1]}:m:${parameterTypes.join(',')}"] << officialName
					memberNamesByOwnerAndName["${normalizedOwner}:${pair[1]}:m"] << officialName
				} else {
					def normalizedOwner = mappingOwner.replace('.', '/')
					memberNamesBySignature["${normalizedOwner}:${pair[1]}:f:"] << pair[0].tokenize(' ').last()
					memberNamesByOwnerAndName["${normalizedOwner}:${pair[1]}:f"] << pair[0].tokenize(' ').last()
				}
			}
		}

		def mappedMemberNames = [:]
		intermediaryMembers.each { member ->
			def parameterTypes = []
			if (member.kind == 'm') {
				def descriptor = member.descriptor.substring(1, member.descriptor.indexOf(')'))
				def cursor = 0
				def primitiveTypes = [B: 'byte', C: 'char', D: 'double', F: 'float', I: 'int', J: 'long', S: 'short', Z: 'boolean']
				while (cursor < descriptor.length()) {
					def dimensions = 0
					while (descriptor.charAt(cursor) == '[') {
						dimensions++
						cursor++
					}
					def typeCode = descriptor.charAt(cursor++)
					def typeName
					if (typeCode == 'L') {
						def end = descriptor.indexOf(';', cursor)
						def obfuscatedType = descriptor.substring(cursor, end)
						def officialType = officialNamesByObfuscatedName[obfuscatedType] ?: obfuscatedType
						typeName = officialType.replace('/', '.')
						cursor = end + 1
					} else {
						typeName = primitiveTypes[typeCode.toString()]
					}
					parameterTypes << (typeName + '[]' * dimensions)
				}
			}
			def memberKey = "${member.owner}:${member.official}"
			def names = memberNamesBySignature["${memberKey}:${member.kind}:${parameterTypes.join(',')}"]
			if (names.isEmpty()) {
				names = memberNamesByOwnerAndName["${memberKey}:${member.kind}"]
			}
			if (names != null && names.size() > 1) {
				throw new GradleException("Ambiguous official mapping for ${member.intermediary}: ${names}")
			}
			def officialMemberName = names == null || names.isEmpty() ? member.official : names.first()
			def previousName = mappedMemberNames[member.intermediary]
			if (previousName != null && previousName != officialMemberName) {
				throw new GradleException("Conflicting official mappings for ${member.intermediary}: ${previousName} and ${officialMemberName}")
			}
			mappedMemberNames[member.intermediary] = officialMemberName
		}
		usedMemberNames.each { intermediaryName ->
			if (!mappedMemberNames.containsKey(intermediaryName)) {
				mappedMemberNames[intermediaryName] = intermediaryName
			}
		}

		def resolvedClassNames = [:]
		classNames.each { intermediaryName, owner ->
			def officialName = officialNamesByClass[owner]
			if (officialName == null) {
				throw new GradleException("No official class mapping found for ${intermediaryName}")
			}
			def simpleName = officialName.substring(officialName.lastIndexOf('.') + 1)
			simpleClassNames[intermediaryName] = simpleName.substring(simpleName.lastIndexOf('$') + 1)
			resolvedClassNames[intermediaryName] = officialName
		}
		classNames = resolvedClassNames
		intermediaryClassSimpleNames.each { intermediarySimpleName, intermediaryName ->
			def owner = intermediaryClassOwners[intermediaryName]
			def officialName = officialNamesByClass[owner]
			if (officialName != null) {
				def mappedSimpleName = officialName.substring(officialName.lastIndexOf('.') + 1)
				simpleClassNames[intermediarySimpleName] = mappedSimpleName.substring(mappedSimpleName.lastIndexOf('$') + 1)
			}
		}
		usedClassNames.each { intermediaryName ->
			if (!simpleClassNames.containsKey(intermediaryName)) {
				simpleClassNames[intermediaryName] = intermediaryName
			}
		}

		def outputRoot = generatedSourceDirectory.get().asFile
		delete(outputRoot)
		sourceFiles.each { sourceFile ->
			def source = sourceFile.getText('UTF-8')
			def importPattern = /(?m)^(\s*import\s+)net\.minecraft\.((?:class_\d+)(?:\.class_\d+)*)(\s*;)/
			source = source.replaceAll(importPattern) { match, prefix, intermediaryPath, suffix ->
				def intermediarySegments = intermediaryPath.split('\\.')
				def intermediaryName = "net/minecraft/${intermediarySegments[0]}"
				if (intermediarySegments.length > 1) {
					intermediaryName += '$' + intermediarySegments.drop(1).join('$')
				}
				def owner = intermediaryClassOwners[intermediaryName]
				def officialName = officialNamesByClass[owner]
				if (officialName == null) {
					throw new GradleException("No official import mapping found for ${intermediaryPath} in ${sourceFile}")
				}
				"${prefix}${officialName.replace('$', '.')}${suffix}"
			}
			source = source.replaceAll(/\bclass_\d+\b/) { match ->
				simpleClassNames[match] ?: match
			}
			source = source.replaceAll(/(\.|::)((?:method|field)_\d+)\b/) { match, access, intermediaryName ->
				def mappedName = mappedMemberNames[intermediaryName]
				if (mappedName == null) {
					throw new GradleException("No official member mapping found for ${intermediaryName} in ${sourceFile}")
				}
				"${access}${mappedName}"
			}
			source = source.replaceAll(/\b(method_\d+)\b(?=\s*\()/) { match, intermediaryName ->
				def mappedName = mappedMemberNames[intermediaryName]
				if (mappedName == null) {
					throw new GradleException("No official method mapping found for ${intermediaryName} in ${sourceFile}")
				}
				mappedName
			}
			source = source.replaceAll(/(["'])(method_\d+|field_\d+)(["'])/) { match, quoteStart, intermediaryName, quoteEnd ->
				def mappedName = mappedMemberNames[intermediaryName]
				if (mappedName == null) {
					throw new GradleException("No official selector mapping found for ${intermediaryName} in ${sourceFile}")
				}
				"${quoteStart}${mappedName}${quoteEnd}"
			}
			def targetFile = new File(outputRoot, sourceRoot.toPath().relativize(sourceFile.toPath()).toString())
			targetFile.parentFile.mkdirs()
			targetFile.setText(source, 'UTF-8')
		}
	}
}

tasks.named('compileJava') {
	dependsOn tasks.named('remapIntermediarySources')
}

java {
	toolchain.languageVersion = JavaLanguageVersion.of(25)
	withSourcesJar()
}

processResources {
	inputs.property 'version', project.version
	filesMatching('fabric.mod.json') {
		expand 'version': project.version
	}
}

jar {
	from('LICENSE_roar_of_love') {
		rename { "${it}_${project.base.archivesName.get()}" }
	}
}
